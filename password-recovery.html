<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery | CEC Student Portal</title>
    <link rel="stylesheet" href="password-recovery.css">
</head>
<body>
    <main class="student-login-page">
        <section class="student-login-card recovery-card" aria-labelledby="recovery-title">
            <img src="cec-logo.png" alt="Cebu Eastern College logo" class="student-logo">
            <h1 id="recovery-title">CEC STUDENT PORTAL</h1>
            <h2 class="recovery-heading">Password Recovery</h2>
            <p class="recovery-message">To recover your password, please enter your Student ID. We will send recovery instructions to your registered email address.</p>

            <form action="#" method="post">
                <label for="recovery-id">Student ID</label>
                <input type="text" id="recovery-id" name="student-id" placeholder="Enter Student ID" required>
                <button type="submit" class="login-button">SEND RECOVERY CODE</button>
            </form>

            <a href="student.html" class="back-link">Back to Login</a>
        </section>
    </main>
</body>
</html>
